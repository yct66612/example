events {
    worker_connections 1024;
}

http {
    log_format upstream_access '$remote_addr [$time_local] "$request" $status '
                               'request_id=$request_id upstream=$upstream_addr '
                               'upstream_status=$upstream_status duration=$request_time';

    access_log /var/log/nginx/access.log upstream_access;

    upstream scheduler_api {
        server app-1:8000 max_fails=3 fail_timeout=10s;
        server app-2:8000 max_fails=3 fail_timeout=10s;
        server app-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://scheduler_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
        }
    }
}
