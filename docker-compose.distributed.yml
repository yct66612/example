x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env.distributed
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
    interval: 5s
    timeout: 3s
    retries: 10

services:
  mysql:
    image: mysql:8.0.31
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env.distributed
    ports:
      - "3307:3306"
    volumes:
      - scheduler-mysql-data:/var/lib/mysql
      - ./deploy/mysql/01-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/migrate_databases.py
    env_file:
      - .env.distributed
    environment:
      APP_INSTANCE: migrate
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *app-common
    environment:
      APP_INSTANCE: app-1

  app-2:
    <<: *app-common
    environment:
      APP_INSTANCE: app-2

  app-3:
    <<: *app-common
    environment:
      APP_INSTANCE: app-3

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy

volumes:
  scheduler-mysql-data:
